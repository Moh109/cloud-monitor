name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Run tests
        run: pytest -q

  posture-scan:
    name: CSPM posture scan (demo account)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Run posture scan and generate reports
        run: |
          cloudguard scan --demo \
            --json out/report.json \
            --html out/report.html
      - name: Upload posture report
        uses: actions/upload-artifact@v4
        with:
          name: cloudguard-report
          path: out/
      # Shift-left gate example. The demo account intentionally contains
      # CRITICAL findings, so this step is allowed to fail without failing CI.
      # Against a real account you would drop `continue-on-error` to block
      # merges that introduce HIGH-or-worse misconfigurations.
      - name: Enforce posture threshold (advisory in demo)
        continue-on-error: true
        run: cloudguard scan --demo --no-console --fail-on HIGH
