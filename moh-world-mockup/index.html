<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MOH World 3D mockup</title>
<!-- ROUGH MOCKUP ONLY. Fake data. ?phase=dawn|day|dusk|night &cam=wide|close|hero &panel=hall|school &ui=0 &hint=0 -->
<script type="importmap">
{ "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0b0f1a; }
  body { font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; }
  #stage { position: relative; width: 1600px; height: 900px; overflow: hidden;
    --ink:#1f2430; --muted:#5d6577; --card:rgba(255,255,255,.93); --solid:#ffffff; --line:#e6e1d6;
    --bar:rgba(255,255,255,.74); --chip:#f3efe6; --red:#e5484d; --amber:#c97d00; --green:#2f9e6a; --blue:#3b6fd8; }
  #stage.dark { --ink:#eef1f7; --muted:#a3abc2; --card:rgba(18,24,44,.93); --solid:#18203a; --line:#2a3452;
    --bar:rgba(9,13,30,.62); --chip:#222b47; --red:#ff6b6f; --amber:#ffb84d; --green:#4cd197; --blue:#8aa9ff; }
  #gl { position: absolute; inset: 0; display: block; }
  #ui { position: absolute; inset: 0; }

  .topbar { position:absolute; top:0; left:0; right:0; height:56px; display:flex; align-items:center;
    justify-content:space-between; padding:0 22px; background:var(--bar); backdrop-filter:blur(8px);
    color:var(--ink); border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; }
  .brand small { font-weight:500; font-size:12px; color:var(--muted); }
  .clock { display:flex; align-items:center; gap:12px; font-size:14px; color:var(--muted); }
  .clock b { color:var(--ink); font-size:17px; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:999px;
    background:var(--chip); color:var(--ink); font-size:12px; font-weight:700; }
  .status { display:flex; gap:16px; align-items:center; font-size:12px; color:var(--muted); }
  .status > span { display:inline-flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--green);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--green) 25%, transparent); }
  .mini-bang { width:16px; height:16px; border-radius:50%; background:var(--red); color:#fff;
    font-weight:900; font-size:11px; display:grid; place-items:center; }

  .label { position:absolute; transform:translate(-50%,-100%); padding:3px 9px 3px 7px; border-radius:999px;
    background:color-mix(in srgb, var(--solid) 72%, transparent); backdrop-filter:blur(10px) saturate(1.4); color:var(--ink); font-size:11px; font-weight:800; letter-spacing:.8px;
    text-transform:uppercase; white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,.2);
    display:flex; align-items:center; gap:6px; }
  .label i { width:9px; height:9px; border-radius:3px; display:inline-block; }
  .label.sel { outline:3px solid #FFD166; }

  .bubble { position:absolute; transform:translate(-50%,-100%); max-width:150px; width:max-content;
    padding:6px 10px 7px; border-radius:12px; color:var(--ink);
    background:color-mix(in srgb, var(--solid) 80%, transparent); backdrop-filter:blur(12px) saturate(1.4);
    border:1px solid color-mix(in srgb, #ffffff 45%, transparent);
    box-shadow:0 6px 18px rgba(10,20,40,.22); font-size:11.5px; line-height:1.25; font-weight:600; }
  .bubble::after { content:""; position:absolute; left:50%; bottom:-6px; transform:translateX(-50%);
    border:6px solid transparent; border-bottom:0; border-top-color:color-mix(in srgb, var(--solid) 80%, transparent); }
  .bubble .k { display:block; font-size:9px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; margin-bottom:2px; }
  .bubble .t { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .k.overdue, .k.follow { color:var(--red); } .k.today { color:var(--amber); } .k.draft { color:var(--blue); }
  .k.next { color:var(--muted); } .k.clear { color:var(--green); } .k.brief { color:var(--ink); }
  .bubble.idle { opacity:.85; font-weight:500; }
  .bang { position:absolute; top:-10px; right:-10px; width:21px; height:21px; border-radius:50%;
    background:var(--red); color:#fff; font-weight:900; font-size:13px; display:grid; place-items:center;
    box-shadow:0 0 0 4px color-mix(in srgb, var(--red) 28%, transparent); }

  .hint { position:absolute; left:20px; bottom:18px; padding:8px 12px; border-radius:10px; background:var(--card);
    color:var(--muted); font-size:12.5px; box-shadow:0 2px 8px rgba(0,0,0,.15); }
  .hint b { color:var(--ink); }

  .panel { position:absolute; top:72px; right:16px; bottom:16px; width:400px; background:var(--card);
    color:var(--ink); border-radius:16px; box-shadow:0 14px 44px rgba(0,0,0,.32); border:1px solid var(--line);
    padding:20px 18px 14px; display:flex; flex-direction:column; backdrop-filter:blur(10px); }
  .eyebrow { font-size:11px; font-weight:800; letter-spacing:1px; color:var(--muted); text-transform:uppercase; }
  .panel h2 { margin:4px 0 2px; font-size:22px; }
  .sub { color:var(--muted); font-size:13px; }
  .close { position:absolute; top:16px; right:16px; width:28px; height:28px; border-radius:8px;
    background:var(--chip); display:grid; place-items:center; color:var(--muted); font-size:15px; }
  .sec { margin-top:14px; }
  .sec h3 { display:flex; align-items:center; gap:8px; margin:0 0 6px; font-size:11.5px; text-transform:uppercase;
    letter-spacing:.8px; color:var(--muted); }
  .count { font-size:11px; padding:1px 7px; border-radius:999px; color:#fff; background:var(--muted); letter-spacing:0; }
  .count.red { background:var(--red); } .count.amber { background:var(--amber); } .count.blue { background:var(--blue); }
  .row { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; background:var(--chip);
    margin-bottom:6px; font-size:13.5px; }
  .row .main { flex:1; min-width:0; }
  .row .title { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .meta { font-size:11.5px; color:var(--muted); margin-top:1px; display:flex; gap:6px; align-items:center; }
  .tag { font-size:10.5px; font-weight:700; padding:0 6px; border-radius:6px; color:#fff; }
  .due { font-size:12px; font-weight:700; white-space:nowrap; text-align:right; }
  .due.red { color:var(--red); } .due.amber { color:var(--amber); } .due.blue { color:var(--blue); }
  .open { color:var(--muted); font-size:14px; }
  .foot { margin-top:auto; font-size:11.5px; color:var(--muted); display:flex; justify-content:space-between;
    border-top:1px solid var(--line); padding-top:10px; }
  .controls { position:absolute; right:20px; bottom:18px; padding:8px 12px; border-radius:10px; background:var(--card);
    color:var(--muted); font-size:12px; box-shadow:0 2px 8px rgba(0,0,0,.15); }
  .mock { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); display:flex; align-items:center; gap:4px;
    padding:6px 8px; border-radius:12px; background:var(--card); box-shadow:0 4px 14px rgba(0,0,0,.2); font-size:12px; white-space:nowrap; }
  .mock b { color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; margin:0 4px 0 10px; }
  .mock b:first-child { margin-left:2px; }
  .mock a { color:var(--ink); text-decoration:none; padding:4px 8px; border-radius:8px; }
  .mock a:hover { background:var(--chip); }
  .mock a.on { background:var(--ink); color:var(--solid); font-weight:700; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1600" height="900"></canvas>
  <div id="ui"></div>
</div>
<script type="module" src="./town3d.js"></script>
</body>
</html>
